name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: fe-aws-hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=
            VITE_ACCESS_TOKEN_KEY=aws-hub.access-token
            VITE_REFRESH_TOKEN_KEY=aws-hub.refresh-token
          tags: |
            ghcr.io/christophermoriarty/fe-aws-hub:${{ github.sha }}
            ghcr.io/christophermoriarty/fe-aws-hub:latest

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          FRONTEND_TAG: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker login ghcr.io -u '${ACTOR}' --password-stdin && FRONTEND_TAG='${FRONTEND_TAG}' /opt/aws-hub/deploy.sh frontend" \
            <<<"$GHCR_TOKEN"
